<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make a Scale of 7</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f4ef;
    color: #171717;
    padding: 32px 24px 48px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: clamp(32px, 5vw, 56px); line-height: .95; margin: 0 0 10px; letter-spacing: -0.045em; }
  .intro { margin: 0 0 28px; color: #666; font-size: 16px; }
  .panel {
    background: white;
    border: 1px solid #d9d7d0;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.04);
  }
  .names {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    min-height: 58px;
    padding: 4px 0 18px;
    border-bottom: 1px solid #e7e5df;
  }
  .name {
    user-select: none;
    cursor: grab;
    background: #171717;
    color: white;
    border-radius: 999px;
    padding: 11px 16px;
    font-weight: 650;
    font-size: 15px;
    touch-action: none;
  }
  .name:active { cursor: grabbing; }
  .instructions { font-size: 13px; color: #777; margin: 10px 0 22px; }
  .labels {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    margin-top: 18px;
    margin-bottom: 0;
  }
  .labels > div { width: 50%; }
  .labels > div:last-child { text-align: right; }
  label { display: none; }
  input {
    width: 50%;
    border: 0;
    border-bottom: 2px solid #171717;
    background: transparent;
    padding: 9px 2px;
    font: inherit;
    font-size: 18px;
    outline: none;
  }
  .labels > div:last-child input { text-align: right; }
  .scale-wrap { overflow-x: auto; padding-bottom: 0; }
  .scale {
    min-width: 780px;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
    position: relative;
    padding-top: 0;
  }
  .scale::before {
    content: "";
    position: absolute;
    top: 0;
    left: 7%;
    right: 7%;
    height: 3px;
    background: #171717;
    z-index: 0;
  }
  .slot-col { position: relative; z-index: 1; text-align: center; }
  .slot-number {
    display: none;

    width: 30px; height: 30px;
    align-items: center; justify-content: center;
    background: #171717; color: white;
    border-radius: 50%;
    font-size: 12px; font-weight: 800;
    margin-bottom: 12px;
  }
  .slot {
    height: 86px;
    border: 2px dashed #bbb8ae;
    border-radius: 14px;
    background: #faf9f5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 7px;
    transition: .15s ease;
  }
  .slot.over { border-color: #171717; background: #eeeae0; transform: translateY(-2px); }
  .slot .name {
    cursor: grab;
    padding: 9px 12px;
    font-size: 14px;
  }
  .extremes { display: none; }

  @media print {
    body { background: white; padding: 0; }
    .wrap { max-width: none; }
    h1 { font-size: 40px; }
    .panel { border: 0; box-shadow: none; padding: 0; }
    .names, .instructions, .controls { display: none; }
    .labels { margin-top: 18px; }
    .labels > div { width: 50%; }
    input { border-bottom: 0; font-weight: 800; }
    .scale-wrap { overflow: visible; }
    .scale, .extremes { min-width: 0; }
    .slot { height: 100px; }
    @page { margin: 18mm; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Bota na escala</h1>
  <div class="panel">
    <div class="names" id="pool"></div>
    <div class="scale-wrap">
      <div class="scale" id="scale"></div>
    </div>

    <div class="labels">
      <div>
        <label for="least">Least</label>
        <input id="least" value="Least" aria-label="Least label">
      </div>
      <div>
        <label for="most">Most</label>
        <input id="most" value="Most" aria-label="Most label">
      </div>
    </div>

    <div class="controls">
      <button onclick="window.print()">Print / Save as PDF</button>
      <button class="secondary" onclick="resetScale()">Reset</button>
      <div class="status" id="status"></div>
    </div>
  </div>
</div>

<script>
const initialNames = ["babi", "gustavo", "iana", "julha", "nico", "nilo", "iacapuca"];
const pool = document.getElementById("pool");
const scale = document.getElementById("scale");
const status = document.getElementById("status");
const least = document.getElementById("least");
const most = document.getElementById("most");
let draggedName = null;

function makeName(name) {
  const el = document.createElement("div");
  el.className = "name";
  el.textContent = name;
  el.draggable = true;
  el.dataset.name = name;
  el.addEventListener("dragstart", () => {
    draggedName = name;
    setTimeout(() => el.style.opacity = ".35", 0);
  });
  el.addEventListener("dragend", () => {
    el.style.opacity = "";
    draggedName = null;
  });
  return el;
}

function build() {
  pool.innerHTML = "";
  scale.innerHTML = "";
  initialNames.forEach(n => pool.appendChild(makeName(n)));

  for (let i = 1; i <= 7; i++) {
    const col = document.createElement("div");
    col.className = "slot-col";
    col.innerHTML = `<div class="slot-number">${i}</div>`;
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.dataset.slot = i;

    slot.addEventListener("dragover", e => {
      e.preventDefault();
      slot.classList.add("over");
    });
    slot.addEventListener("dragleave", () => slot.classList.remove("over"));
    slot.addEventListener("drop", e => {
      e.preventDefault();
      slot.classList.remove("over");
      if (!draggedName) return;

      // If the destination already has someone, send that person back to the pool.
      const existing = slot.querySelector(".name");
      if (existing) pool.appendChild(makeName(existing.dataset.name));

      // Remove the dragged person wherever they currently are.
      document.querySelectorAll(`.name[data-name="${CSS.escape(draggedName)}"]`).forEach(x => x.remove());
      slot.appendChild(makeName(draggedName));
      updateStatus();
    });

    // Mobile/touch-friendly click behavior: clicking a name selects it; clicking a slot places it.
    slot.addEventListener("click", () => {
      if (!selectedName) return;
      const existing = slot.querySelector(".name");
      if (existing) pool.appendChild(makeName(existing.dataset.name));
      document.querySelectorAll(`.name[data-name="${CSS.escape(selectedName)}"]`).forEach(x => x.remove());
      slot.appendChild(makeName(selectedName));
      selectedName = null;
      updateStatus();
    });

    col.appendChild(slot);
    scale.appendChild(col);
  }

  // All names start both visually available in the top pool and ordered alphabetically.
  updateStatus();
}

let selectedName = null;

pool.addEventListener("click", e => {
  const n = e.target.closest(".name");
  if (!n) return;
  selectedName = n.dataset.name;
  document.querySelectorAll(".name").forEach(x => x.style.outline = "");
  n.style.outline = "3px solid #aaa";
});


function updateStatus() {
  const placed = scale.querySelectorAll(".slot .name").length;
  status.textContent = `${placed}/7 placed`;
}

function resetScale() {
  build();
  least.value = "Least";
  most.value = "Most";
}

build();
</script>
</body>
</html>
